name: Deploy

# The demo is only useful if it matches main. Deploying by hand let it sit three
# commits behind without any signal that it had.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Never publish a build whose checks did not pass.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check for deploy credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.present == 'true'

      - run: npm run build
        if: steps.creds.outputs.present == 'true'

      - name: Deploy prebuilt output
        if: steps.creds.outputs.present == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prebuilt --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
