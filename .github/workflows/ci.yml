name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python -m pip install -r scripts/requirements.txt

      - name: Parser and validator regression tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      # Exits non-zero on a `check`, a failing invariant in the exported data.
      # A `review` is an unresolved source difference and does not fail the build.
      - name: Validate exported data
        run: python scripts/validate_budget.py

  web:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run build
